name: Build MXQ H3Q44
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/boards/mxq-h3q44.tvb'
      - 'dtb/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MXQ files
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: armbian-build
      - name: Integrate MXQ board and device tree
        run: |
          cp project/config/boards/mxq-h3q44.tvb armbian-build/config/boards/
          for d in armbian-build/patch/kernel/archive/sunxi-*/dt_32; do
            mkdir -p "$d"
            cp project/dtb/sun8i-h3-mxq-4k-h3q44.dts "$d/"
          done
      - name: Build minimal SD image
        run: |
          cd armbian-build
          ./compile.sh BOARD=mxq-h3q44 BRANCH=current RELEASE=bookworm BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no
      - name: Publish image
        uses: actions/upload-artifact@v4
        with:
          name: MXQ-H3Q44-SD-image
          path: armbian-build/output/images/*.img*
          if-no-files-found: error
          retention-days: 7
